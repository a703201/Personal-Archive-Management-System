# ============================================================
# AMS · 前端镜像 nginx 配置（SPA 托管）
# ------------------------------------------------------------
# 仅托管 web/dist 静态产物；/api 由后端（ams-server）统一提供。
# 若要把前端与后端打进同一栈，请用 deploy/compose 的全栈编排。
# ============================================================

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 反向代理到后端 ams-server（同 ams-net 用户网络，容器名直连）。
  # 这样“新前端(ams-web)”与“后端(ams-server)”并存，登录/注册等接口可用。
  location /api {
    proxy_pass http://ams-server:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 【必须覆盖而非追加】后端 ClientIp 取 XFF 最左段作为限流 / 验证码分桶键。
    # 用 $proxy_add_x_forwarded_for 会把客户端自带的伪造 XFF 保留在左侧，
    # 使限流可被绕过；用 $remote_addr 覆盖可保证该值由反代生成、不可伪造。
    # 启用后端解析还需在 ams 服务设置 AMS_TRUST_PROXY_HEADERS=true（见 deploy/README §4.6）。
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 兼容可能的长连接/WebSocket（通知、审计流等）
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
  }

  # SPA history 回退：vue-router 使用 createWebHistory，
  # 直接访问 /archive、/overview 等深链时回落到 index.html。
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 带内容哈希的构建产物可安全长缓存
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # 入口不缓存，保证发版即时生效
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # 压缩（文本类资源）
  gzip on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    image/svg+xml
    application/octet-stream;

  # 基础安全响应头
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
}
