components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiEnvelope:
      type: object
      description: 统一成功响应信封（http.cj ApiResponse.ok）。所有 2xx 响应外层均为该结构。
      properties:
        code: { type: string, description: 业务码，成功固定为 OK }
        message: { type: string, description: 描述，成功固定为 success }
        data: { type: object, additionalProperties: true, description: 业务数据主体，具体结构见各资源 schema 与对应操作 }
        requestId: { type: string, description: 请求 ID }
      required: [code, message, requestId]
      additionalProperties: true
    ErrorResponse:
      type: object
      description: 统一错误响应体（http.cj ApiResponse.error）。
      properties:
        code: { type: string, description: 业务错误码，如 AUTH_FAILED / ACL_DENIED / VALIDATION_FAILED }
        message: { type: string, description: 错误描述 }
        field: { type: string, description: 触发校验错误的字段名 }
        requestId: { type: string, description: 请求 ID }
        details: { type: object, additionalProperties: true, description: RFC 7807 风格附加明细 }
      required: [code, message, requestId]
      additionalProperties: true
    ActionResult:
      type: object
      description: 通用动作结果（创建 / 更新 / 删除 / 状态流转等）。具体字段由各 handler 决定。
      properties:
        id: { type: string }
        status: { type: integer }
        updated: { type: boolean }
        deleted: { type: boolean }
        restored: { type: boolean }
        cancelled: { type: boolean }
      additionalProperties: true
    AuthTokens:
      type: object
      description: 登录 / 刷新下发的令牌（auth.cj login / refresh）。
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        sid: { type: string, description: 会话 ID }
        expiresAt: { type: integer, format: int64, description: 过期时间，epoch 毫秒 }
      additionalProperties: true
    PageInfo:
      type: object
      description: 分页列表响应主体（items.cj / audit.cj / family.cj 的 total / page / size / items 结构）。
      properties:
        total: { type: integer, format: int64, description: 总条数 }
        page: { type: integer, description: 当前页码，从 1 起 }
        size: { type: integer, description: 每页条数 }
        items:
          type: array
          items: { type: object, additionalProperties: true }
          description: 当前页数据，元素结构见对应资源 schema
      additionalProperties: true
    Item:
      type: object
      description: 档案条目（items.cj toJson / toJsonOf）。ID 以字符串承载，时间戳为 epoch 毫秒整数。
      properties:
        id: { type: string, description: 条目 ID }
        subjectId: { type: string, description: 归属主体 ID }
        category: { type: integer, description: 分类码，1-11 }
        title: { type: string }
        status: { type: integer, description: 状态码 }
        sensitivity: { type: integer, description: 敏感度码，1 普通 / 2 敏感 / 3 高 }
        issuedDate: { type: string, description: 签发日期 YYYY-MM-DD }
        expiresAt: { type: string, description: 有效期 YYYY-MM-DD }
        issuer: { type: string }
        remark: { type: string }
        version: { type: integer, description: 乐观锁版本号 }
        source: { type: integer, description: 来源系统码 }
        shared: { type: boolean, description: 是否来自家庭共享授权 }
        createdAt: { type: integer, format: int64, description: 创建时间，epoch 毫秒 }
        updatedAt: { type: integer, format: int64, description: 更新时间，epoch 毫秒 }
        extra: { type: object, additionalProperties: true, description: 自定义扩展字段，后端以 extraJson 文本承载 }
      additionalProperties: true
    Subject:
      type: object
      description: 档案主体（subjects.cj SubjectView.toJson）。
      properties:
        id: { type: string }
        name: { type: string }
        alias: { type: string }
        relation: { type: integer, description: 与本人的关系码 }
        isPrimary: { type: boolean, description: 是否「本人」主体 }
        status: { type: integer }
        completeness: { type: integer, description: 资料完整度 }
        summary: { type: string }
        version: { type: integer, description: 乐观锁版本号 }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
      additionalProperties: true
    Attachment:
      type: object
      description: 附件（attachments.cj attachmentJson）。大小 / 计数为整数，时间戳为 epoch 毫秒。
      properties:
        id: { type: integer, format: int64 }
        subjectId: { type: integer, format: int64 }
        itemId: { type: integer, format: int64 }
        category: { type: integer }
        title: { type: string }
        currentVersionId: { type: integer, format: int64 }
        versionCount: { type: integer }
        fileSize: { type: integer, format: int64, description: 当前版本字节数 }
        fileExt: { type: string }
        mimeType: { type: string }
        status: { type: integer }
        downloadCount: { type: integer }
        summary: { type: string }
        keywords: { type: string }
      additionalProperties: true
    ShareLink:
      type: object
      description: 分享链接（share.cj 创建返回 / 列表项）。
      properties:
        id: { type: string }
        token: { type: string }
        url: { type: string, description: 相对分享路径 }
        itemId: { type: string }
        protected: { type: boolean, description: 是否口令保护 }
        maxFails: { type: integer }
        expiresAt: { type: integer, format: int64, description: 过期时间，epoch 毫秒 }
        revoked: { type: boolean }
        expired: { type: boolean }
        viewCount: { type: integer }
      additionalProperties: true
    AuditLog:
      type: object
      description: 审计日志条目（audit.cj auditJson）。
      properties:
        chainSeq: { type: integer, format: int64, description: 哈希链序号 }
        actorId: { type: string, description: 操作者 ID }
        action: { type: string }
        actionDesc: { type: string }
        targetType: { type: string }
        targetId: { type: string }
        subjectId: { type: string }
        category: { type: integer }
        result: { type: integer, description: 结果码 }
        errorCode: { type: string }
        clientIp: { type: string }
        traceId: { type: string }
        occurredAt: { type: integer, format: int64, description: 发生时间，epoch 毫秒 }
      additionalProperties: true
    User:
      type: object
      description: 用户档案（me.cj me()）。管理端用户列表经 rowsToJson 输出，动态列以 additionalProperties 保留；邮箱与手机为掩码值。
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        nickname: { type: string }
        email: { type: string, description: 掩码后的邮箱 }
        phone: { type: string, description: 掩码后的手机号 }
        status: { type: integer }
        perms:
          type: array
          items: { type: string }
          description: 当前会话权限点集合
      additionalProperties: true
    Role:
      type: object
      description: 角色（management.cj 角色管理）。数据库行经 rowsToJson 输出，动态列以 additionalProperties 保留。
      properties:
        code: { type: string, description: 角色编码 }
        name: { type: string }
        description: { type: string }
      additionalProperties: true
    FamilyGroup:
      type: object
      description: 家庭组（family.cj 组列表 / 详情）。
      properties:
        groupId: { type: string }
        name: { type: string }
        ownerId: { type: string }
        myRole: { type: string, description: 当前成员在组内的角色 }
        role: { type: string }
        memberCount: { type: integer }
        canInvite: { type: boolean }
        canGrant: { type: boolean }
        canDissolve: { type: boolean }
        createdAt: { type: integer, format: int64 }
      additionalProperties: true
    ImportTask:
      type: object
      description: 导入任务（import.cj / export.cj ExportRoutes.taskJson，导入与导出共用任务视图）。
      properties:
        id: { type: string }
        taskNo: { type: string, description: 任务号 }
        type: { type: string, description: 任务类型 }
        status: { type: integer, description: 任务状态码 }
        total: { type: integer }
        done: { type: integer }
        failed: { type: integer }
        percent: { type: integer }
        format: { type: string }
        rows: { type: integer }
        expiresAt: { type: integer, format: int64 }
        error: { type: string }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
      additionalProperties: true
    ExportTask:
      type: object
      description: 导出任务（export.cj ExportRoutes.taskJson，字段与 ImportTask 一致）。
      properties:
        id: { type: string }
        taskNo: { type: string, description: 任务号 }
        type: { type: string, description: 任务类型 }
        status: { type: integer, description: 任务状态码 }
        total: { type: integer }
        done: { type: integer }
        failed: { type: integer }
        percent: { type: integer }
        format: { type: string }
        rows: { type: integer }
        expiresAt: { type: integer, format: int64 }
        error: { type: string }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
      additionalProperties: true
    HealthStatus:
      type: object
      description: 健康状态。/api/health 返回 status=ok；/api/admin/health 额外返回进程指标（system.cj health）。
      properties:
        status: { type: string, description: 服务状态，公开检查固定为 ok }
        uptimeMs: { type: integer, format: int64, description: 进程运行时长，毫秒 }
        windowStart: { type: integer, format: int64 }
        requests: { type: integer, format: int64, description: 窗口内请求数 }
        error4xx: { type: integer, format: int64 }
        error5xx: { type: integer, format: int64 }
        errorRatePermille: { type: integer, description: 5xx 千分比 }
        onlineSessions: { type: integer }
        dbLatencyMs: { type: integer, description: 数据库往返延迟，毫秒 }
        storageBytes: { type: integer, format: int64 }
        storageFiles: { type: integer }
        tables:
          type: array
          items: { type: object, additionalProperties: true }
          description: 核心表行数，元素含 table 与 rows
      additionalProperties: true
  responses:
    Success:
      description: 成功
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 未认证或令牌失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 无权限（对象级鉴权拒绝）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: 服务端内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
