# ============================================================
# AMS · 发布（GitHub Release · 二进制程序）
#
# 触发：推送形如 v* 的 tag，或手动 workflow_dispatch
#
# 流程：检出 → 准备工具链 → 构建（编译后端） → 单元测试 →
#       打包二进制发布包 → 校验可独立运行 → 创建 Release 并上传资产；
#       **Release 说明（notes）自动取自 CHANGELOG.md 对应版本段落**。
#
# 用法（本地）：
#   git tag -a v1.2.0 -m "AMS 1.2.0"
#   git push origin v1.2.0
#   # 本 workflow 会自动编译并发布二进制程序
#
#   或一步到位（脚本方式，不需要配 runner）：
#   bash scripts/release.sh --version 1.2.0
#
# 产物：
#   ams-release-<version>-windows-x86_64.zip
#   含：bin/（exe + 全部运行时 DLL）/ web/dist/ / config/ / scripts/ / docs/ / LICENSE / CHECKSUMS.sha256
#
# ⚠️ 工具链前提（编译后端需要仓颉 SDK）：
#   本 job 默认在 windows-latest（GitHub 托管）运行，工具链来源见
#   scripts/ci/setup-toolchain.sh：
#     ① 仓库变量 CANGJIE_TOOLCHAIN_TAG 指定的 GitHub Release 工具链资产（推荐）
#     ② 仓库变量 CANGJIE_SDK_URL 指定的 SDK 直链
#   若使用已装好仓颉 SDK 的自托管 Windows runner，把下方
#   runs-on 改为对应 self-hosted 标签即可（setup-toolchain.sh 会跳过下载）。
# ============================================================
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.2.0），手动触发时必填'
        required: true
        type: string

permissions:
  contents: write    # 创建 Release 与上传资产需要

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: 检出代码（含 tag）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 确定版本号
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ inputs.version }}"
            VER="${VER#v}"
          else
            VER="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "发布版本：${VER}"

      - name: 缓存工具链
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ams-toolchain
            ~/.cache/ams-stdx
          key: ams-toolchain-${{ runner.os }}-1.2.0
          restore-keys: |
            ams-toolchain-${{ runner.os }}-

      - name: 准备工具链（SDK / stdx / 驱动）
        shell: bash
        run: bash scripts/ci/setup-toolchain.sh

      - name: 构建（编译后端二进制）
        shell: bash
        run: bash scripts/build.sh

      - name: 单元测试
        shell: bash
        run: bash scripts/test.sh

      - name: 打包二进制发布包
        shell: bash
        run: bash scripts/package.sh --skip-build --version "${{ steps.ver.outputs.version }}"

      - name: 校验发布包可独立运行
        shell: bash
        run: |
          bash scripts/ci/verify-package.sh \
            "dist/ams-release-${{ steps.ver.outputs.version }}-windows-x86_64" 18099

      - name: 创建 / 复用 Release（notes 取自 CHANGELOG）
        id: rel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -e
          VER="${VERSION}"
          TAG="v${VER}"
          ZIP="dist/ams-release-${VER}-windows-x86_64.zip"
          NOTES="$(mktemp)"
          # 取 CHANGELOG.md 中本版本段落作为 Release 说明
          python3 -c "import re,sys; v=sys.argv[1]; t=open('CHANGELOG.md',encoding='utf-8').read(); m=re.search(r'^##\s+\[?v?'+re.escape(v)+r'\]?.*?(?=^##\s|\Z)',t,re.M|re.S); open(sys.argv[2],'w',encoding='utf-8').write(m.group(0).strip() if m else 'AMS '+sys.argv[1])" "$VER" "$NOTES"
          [ -s "$NOTES" ] || echo "AMS ${VER}" > "$NOTES"

          REL_ID="$(curl --ssl-no-revoke -fsS -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "")"

          if [ -z "$REL_ID" ]; then
            echo "创建 Release ${TAG}..."
            REL_ID="$(curl --ssl-no-revoke -fsS -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
              -d "$(python3 -c \"import json,sys; print(json.dumps({'tag_name':sys.argv[1],'name':'AMS '+sys.argv[2],'body':open(sys.argv[3],encoding='utf-8').read(),'draft':False,'prerelease':False},ensure_ascii=False))\" "$TAG" "$VER" "$NOTES")" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")"
            echo "      已创建（id=${REL_ID}）"
          else
            echo "      Release 已存在（id=${REL_ID}），复用并上传资产"
            # 删掉同名旧资产，避免 422
            ASSET_ID="$(curl --ssl-no-revoke -fsS -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${REL_ID}/assets" \
              2>/dev/null | python3 -c "import sys,json; n=sys.argv[1]; print(next((a['id'] for a in json.load(sys.stdin) if a.get('name')==n),''))" "$(basename "$ZIP")")"
            if [ -n "$ASSET_ID" ]; then
              curl --ssl-no-revoke -fsS -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" || true
            fi
          fi

          echo "id=${REL_ID}" >> "$GITHUB_OUTPUT"

      - name: 上传二进制资产
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          REL_ID: ${{ steps.rel.outputs.id }}
        run: |
          set -e
          VER="${VERSION}"
          REL_ID="${REL_ID}"
          ZIP="dist/ams-release-${VER}-windows-x86_64.zip"
          echo "上传 ${ZIP} ..."
          # ⚠️ 必须用 `-F "file=@..."`（multipart/form-data）。
          #   `--data-binary "@file"` 发的是原始 body，GitHub 不接受（400）。
          #   `-F` 还会流式发送，不把整个文件读进内存。
          # --ssl-no-revoke：Windows runner 的 curl 用 schannel，
          # 默认查证书吊销状态，被代理/防火墙挡住时失败
          # （CRYPT_E_NO_REVOCATION_CHECK 0x80092012）。
          CODE="$(curl -sS -o /tmp/ams_upload.out -w "%{http_code}" \
            --ssl-no-revoke \
            --max-time 1800 \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -F "file=@${ZIP}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${REL_ID}/assets?name=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$(basename "$ZIP")")")"
          if [ "$CODE" != "201" ] && [ "$CODE" != "200" ]; then
            echo "::error::资产上传失败（HTTP ${CODE}）"
            head -c 500 /tmp/ams_upload.out
            exit 1
          fi
          echo "上传完成"

      - name: 写入发布摘要
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          {
            echo "## AMS ${VERSION} 发布成功"
            echo ""
            echo "- 产物：\`ams-release-${VERSION}-windows-x86_64.zip\`"
            echo "- 校验和：见包内 \`CHECKSUMS.sha256\`"
            echo "- 部署：见包内 \`DEPLOY.md\` / \`docs/09\`"
            echo "- Release 说明：自动取自 \`CHANGELOG.md\` 的 \`[${VERSION}]\` 段落"
          } >> "$GITHUB_STEP_SUMMARY"
