# ============================================================
# AMS · 发布（GitHub Release · 源码包）
#
# 触发：推送形如 v* 的 tag，或手动 workflow_dispatch
#
# 流程：
#   ① 检出源码（含完整历史，供 git archive 生成干净源码树）
#   ② 前端构建门禁（npm ci + npm run build，验证源码可构建）
#   ③ 打包源码（git archive 生成 tar.gz + zip，自动排除 .git 与忽略文件）
#   ④ 创建 / 复用 Release 并上传源码包资产
#
# 用法（本地）：
#   git tag -a v1.2.0 -m "AMS 1.2.0"
#   git push origin v1.2.0
#   # 本 workflow 会自动打包源码并发布
#
#   或一步到位（脚本方式，不需要配 runner）：
#   bash scripts/release.sh --version 1.2.0
#
# 产物（跨平台源码分发，不再发布特定平台的编译二进制）：
#   ams-source-<version>.tar.gz
#   ams-source-<version>.zip
#   含：仓颉后端源码 / web 前端源码 / deploy/ / docs/ / 配置与脚本
#   部署：见 deploy/README.md；前端构建见 web/ 内说明
# ============================================================
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.2.0），手动触发时必填'
        required: true
        type: string

permissions:
  contents: write    # 创建 Release 与上传资产需要

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-source:
    # 源码包跨平台、且需要的是 git + node（前端门禁），用 ubuntu 最轻量稳定。
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码（含 tag 与完整历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 确定版本号
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ inputs.version }}"
          else
            VER="${GITHUB_REF_NAME#v}"
          fi
          VER="${VER#v}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "发布版本：${VER}"

      - name: 前端构建门禁（验证源码可构建）
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: 打包源码（tar.gz + zip）
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          VER="${VERSION}"
          PREFIX="ams-${VER}"
          mkdir -p dist
          # git archive 生成干净源码树：不含 .git、不含被 .gitignore 忽略的文件
          # （如 node_modules / 构建产物 / .tmp 等），跨平台且轻量。
          git archive --format=tar --prefix="${PREFIX}/" HEAD \
            | gzip -9 > "dist/ams-source-${VER}.tar.gz"
          git archive --format=zip --prefix="${PREFIX}/" HEAD \
            -o "dist/ams-source-${VER}.zip"
          echo "### 源码包" >> "$GITHUB_STEP_SUMMARY"
          ls -lh dist/ams-source-* >> "$GITHUB_STEP_SUMMARY"

      - name: 创建 / 复用 Release
        id: rel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -e
          VER="${VERSION}"
          TAG="v${VER}"
          REL_ID="$(curl --ssl-no-revoke -fsS -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "")"
          if [ -z "$REL_ID" ]; then
            NOTES="$(mktemp)"
            if [ -f CHANGELOG.md ]; then
              python3 - "$VER" "$NOTES" <<'PYEOF'
import re, sys
version, out = sys.argv[1], sys.argv[2]
try:
    text = open("CHANGELOG.md", encoding="utf-8").read()
except Exception:
    sys.exit(0)
m = re.search(r"^##\s+\[?v?" + re.escape(version) + r"\]?.*?(?=^##\s|\Z)", text, re.M | re.S)
if m:
    open(out, "w", encoding="utf-8").write(m.group(0).strip())
PYEOF
            fi
            [ -s "$NOTES" ] || echo "AMS ${VER}" > "$NOTES"
            REL_ID="$(curl --ssl-no-revoke -fsS -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
              -d "$(python3 - "$TAG" "$VER" "$NOTES" <<'PYEOF'
import json, sys
tag, version, notes_file = sys.argv[1], sys.argv[2], sys.argv[3]
try:
    body = open(notes_file, encoding="utf-8").read()
except Exception:
    body = ""
print(json.dumps({"tag_name": tag, "name": "AMS " + version, "body": body,
                  "draft": False, "prerelease": False}, ensure_ascii=False))
PYEOF
)" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")"
            echo "已创建 Release ${TAG}（id=${REL_ID}）"
          else
            echo "Release 已存在（id=${REL_ID}），复用并上传资产"
          fi
          echo "id=${REL_ID}" >> "$GITHUB_OUTPUT"

      - name: 上传源码包资产
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          REL_ID: ${{ steps.rel.outputs.id }}
        run: |
          set -e
          VER="${VERSION}"
          REL_ID="${REL_ID}"
          for PKG in "dist/ams-source-${VER}.tar.gz" "dist/ams-source-${VER}.zip"; do
            NAME="$(basename "$PKG")"
            echo "上传 ${NAME} ..."
            # 删除同名旧资产，避免 422
            ASSET_ID="$(curl --ssl-no-revoke -fsS -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${REL_ID}/assets" \
              2>/dev/null | python3 -c '
import sys, json
name = sys.argv[1]
try:
    for a in json.load(sys.stdin):
        if a.get("name") == name:
            print(a["id"]); break
except Exception:
    pass
' "$NAME")"
            if [ -n "$ASSET_ID" ]; then
              curl --ssl-no-revoke -fsS -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" || true
            fi
            CODE="$(curl -sS -o /tmp/ams_upload.out -w "%{http_code}" \
              --ssl-no-revoke --max-time 1800 -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -F "file=@${PKG}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${REL_ID}/assets?name=$(python3 -c "
import urllib.parse, sys
print(urllib.parse.quote(sys.argv[1]))" "$NAME")")"
            if [ "$CODE" != "201" ] && [ "$CODE" != "200" ]; then
              echo "::error::资产上传失败（HTTP ${CODE}）"
              head -c 500 /tmp/ams_upload.out
              exit 1
            fi
            echo "  ${NAME} 上传完成"
          done

      - name: 写入发布摘要
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          {
            echo "## AMS ${VERSION} 源码发布成功"
            echo ""
            echo "- 源码包：\`ams-source-${VERSION}.tar.gz\` / \`ams-source-${VERSION}.zip\`"
            echo "- 内容：仓颉后端源码 / web 前端源码 / deploy/ / docs/ / 配置脚本"
            echo "- 构建与部署：见 \`deploy/README.md\`；前端 \`cd web && npm ci && npm run build\`"
          } >> "$GITHUB_STEP_SUMMARY"
