# ============================================================
# AMS · 发布（GitHub Release · 二进制程序）
#
# 触发：推送形如 v* 的 tag，或手动 workflow_dispatch
#
# 流程：检出 → 准备工具链 → 构建（编译后端） → 单元测试 →
#       打包二进制发布包 → 校验可独立运行 → 创建 Release 并上传资产；
#       **Release 说明（notes）自动取自 CHANGELOG.md 对应版本段落**。
#
# 用法（本地）：
#   git tag -a v1.2.0 -m "AMS 1.2.0"
#   git push origin v1.2.0
#   # 本 workflow 会自动编译并发布二进制程序
#
#   或一步到位（脚本方式，不需要配 runner）：
#   bash scripts/release.sh --version 1.2.0
#
# 产物：
#   ams-release-<version>-windows-x86_64.zip
#   含：bin/（exe + 全部运行时 DLL）/ web/dist/ / config/ / scripts/ / docs/ / LICENSE / CHECKSUMS.sha256
#   ams-kit-<KIT_VERSION>-windows-x86_64.zip   （方案 A 框架静态库包，由 package-kit.sh 产出）
#   ams-mobile-<version>.app                   （鸿蒙客户端 App Pack；仅在装有鸿蒙 SDK 的环境构建，托管 runner 自动跳过）
#
# ⚠️ 工具链前提（编译后端需要仓颉 SDK）：
#   本 job 默认在 windows-latest（GitHub 托管）运行，工具链来源见
#   scripts/ci/setup-toolchain.sh：
#     ① 仓库变量 CANGJIE_TOOLCHAIN_TAG 指定的 GitHub Release 工具链资产（推荐）
#     ② 仓库变量 CANGJIE_SDK_URL 指定的 SDK 直链
#   若使用已装好仓颉 SDK 的自托管 Windows runner，把下方
#   runs-on 改为对应 self-hosted 标签即可（setup-toolchain.sh 会跳过下载）。
# ============================================================
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.2.0），手动触发时必填'
        required: true
        type: string

permissions:
  contents: write    # 创建 Release 与上传资产需要

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: 检出代码（含 tag）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 确定版本号
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ inputs.version }}"
            VER="${VER#v}"
          else
            VER="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "发布版本：${VER}"

      - name: 静态一致性门禁（无需数据库 / SDK）
        shell: bash
        run: python3 scripts/ci/check-consistency.py

      - name: 缓存工具链
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ams-toolchain
            ~/.cache/ams-stdx
          key: ams-toolchain-${{ runner.os }}-1.2.0
          restore-keys: |
            ams-toolchain-${{ runner.os }}-

      - name: 准备工具链（SDK / stdx / 驱动）
        shell: bash
        run: bash scripts/ci/setup-toolchain.sh

      - name: 构建（编译后端二进制）
        shell: bash
        run: bash scripts/build.sh

      - name: 单元测试
        shell: bash
        run: bash scripts/test.sh

      - name: 构建前端
        shell: bash
        run: cd web && npm ci && npm test && npm run build

      - name: 打包二进制发布包
        shell: bash
        run: bash scripts/package.sh --skip-build --skip-web --version "${{ steps.ver.outputs.version }}"

      - name: 校验发布包可独立运行
        shell: bash
        run: |
          bash scripts/ci/verify-package.sh \
            "dist/ams-release-${{ steps.ver.outputs.version }}-windows-x86_64" 18099

      - name: 打包 ams-kit 框架静态库包（方案 A 分发产物）
        shell: bash
        run: bash scripts/package-kit.sh

      - name: 校验 ams-kit 包（外部接入方编译链接运行）
        shell: bash
        env:
          CANGJIE_HOME: ${{ env.CANGJIE_HOME }}
          CANGJIE_STDX: ${{ env.CANGJIE_STDX }}
        run: bash scripts/ci/verify-kit-package.sh

      # 构建鸿蒙客户端（可选）：本步仅在装有 DevEco Studio / 鸿蒙 SDK 的
      # 自托管 runner 上成功；GitHub 托管 runner（无 SDK）会失败，但 continue-on-error
      # 使其不阻塞 Release，upload-asset.sh 也因找不到 .app 而自动跳过。
      - name: 构建鸿蒙客户端（可选·需鸿蒙 SDK 环境）
        shell: bash
        continue-on-error: true
        run: bash mobile/build_hap.sh

      - name: 创建 / 复用 Release（notes 取自 CHANGELOG）
        id: rel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: bash scripts/ci/publish-release.sh

      - name: 上传二进制资产
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          REL_ID: ${{ steps.rel.outputs.id }}
        run: bash scripts/ci/upload-asset.sh

      - name: 写入发布摘要
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          {
            echo "## AMS ${VERSION} 发布成功"
            echo ""
            echo "- 产物：\`ams-release-${VERSION}-windows-x86_64.zip\`"
            echo "- 校验和：见包内 \`CHECKSUMS.sha256\`"
            echo "- 部署：见包内 \`DEPLOY.md\` / \`docs/09\`"
            echo "- 框架包：\`ams-kit-<KIT_VERSION>-windows-x86_64.zip\`（随 Release 一并上传，由 \`scripts/package-kit.sh\` 产出）"
            echo "- 鸿蒙客户端：\`ams-mobile-${VERSION}.app\`（若构建环境含鸿蒙 SDK 则随 Release 上传，否则自动跳过）"
            echo "- Release 说明：自动取自 \`CHANGELOG.md\` 的 \`[${VERSION}]\` 段落"
          } >> "$GITHUB_STEP_SUMMARY"
