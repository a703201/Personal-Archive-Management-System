# ============================================================
# AMS · 持续集成
#
# 触发：push 到 develop/main、PR、workflow_dispatch
#
# 流程：静态一致性门禁 → 准备工具链 → 构建 → 单元测试 →
#       端到端回归（需 DB） → 前端单测与构建 → 发布包校验
#
# 关于 E2E：
#   GitHub 托管 Windows runner 无法起 openGauss service container，
#   因此未配置 secrets.AMS_DB_PASSWORD 时 7 项端到端回归会「显式跳过」：
#   输出 ::warning:: 并在 Job Summary 标注 SKIPPED，不再伪装成全绿。
#   需要真跑时，在自托管 runner（有 openGauss）上执行：
#       bash scripts/ci/verify-e2e.sh
#
# 工具链来源见 scripts/ci/setup-toolchain.sh（Release 资产 / SDK 直链 / 本机 SDK）。
# ============================================================
name: CI

on:
  push:
    branches: [develop, main, master]
  pull_request:
    branches: [develop, main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # 需要 tag 信息

      - name: 静态一致性门禁（无需数据库 / SDK）
        shell: bash
        run: python3 scripts/ci/check-consistency.py

      - name: 缓存工具链
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ams-toolchain
            ~/.cache/ams-stdx
          key: ams-toolchain-${{ runner.os }}-1.2.0
          restore-keys: |
            ams-toolchain-${{ runner.os }}-

      - name: 准备工具链（SDK / stdx / 驱动）
        shell: bash
        run: bash scripts/ci/setup-toolchain.sh

      - name: 打印版本信息
        shell: bash
        run: |
          echo "### 工具链" >> "$GITHUB_STEP_SUMMARY"
          echo "- CANGJIE_HOME: $CANGJIE_HOME" >> "$GITHUB_STEP_SUMMARY"
          echo "- CANGJIE_STDX: $CANGJIE_STDX" >> "$GITHUB_STEP_SUMMARY"
          "$CANGJIE_HOME/bin/cjc.exe" -v 2>&1 | head -3 || true

      - name: 构建
        shell: bash
        run: bash scripts/build.sh

      - name: 单元测试
        shell: bash
        run: bash scripts/test.sh

      - name: 端到端回归（需 openGauss，共 7 组）
        shell: bash
        env:
          AMS_DB_PASSWORD: ${{ secrets.AMS_DB_PASSWORD }}
        run: |
          if [ -n "$AMS_DB_PASSWORD" ]; then
            bash scripts/ci/verify-e2e.sh
            echo "- E2E: 7 groups executed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::未配置 secrets.AMS_DB_PASSWORD，7 组端到端回归未执行（集成测试 / 授权链路 / 口令策略 / 审计哈希链 / 多租户隔离 / 家庭协作 / 审计链独立校验）"
            echo "- E2E SKIPPED (7 groups): secrets.AMS_DB_PASSWORD not set; hosted runner has no openGauss service" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 前端单测与构建
        shell: bash
        run: cd web && npm ci && npm test && npm run build

      - name: 打包校验（确保发布物可独立运行）
        shell: bash
        run: bash scripts/package.sh --skip-build --skip-web --version 0.0.0-ci

      - name: 校验发布包可独立运行
        shell: bash
        run: bash scripts/ci/verify-package.sh dist/ams-release-0.0.0-ci-windows-x86_64 18099
