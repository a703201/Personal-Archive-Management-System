# ============================================================
# AMS · Linux 持续集成（opt-in）
#
# 与 .github/workflows/ci.yml（Windows）平行：
#   - preflight：所有触发都跑，做无需 SDK 的静态一致性门禁（真实工作，
#     不再是「成功但什么都不做」的占位 job）
#   - build-and-test-linux-hosted：仅在配置 CANGJIE_LINUX_SDK_URL 时跑
#     Linux 构建 + 单测 + 前端构建
#
# 触发策略：workflow_dispatch 或 push 到 ci-linux 分支，
# 默认不监听 develop/main，避免在没有 Linux 工具链的机器上误跑失败。
#
# 自托管 Linux runner 方案（装好 Cangjie 1.2.x，标签 linux + cangjie）：
#   把 build-and-test-linux-hosted 的 runs-on 改为
#   [self-hosted, linux, cangjie]，并去掉「安装 Cangjie SDK」步骤。
# ============================================================
name: CI-Linux

on:
  workflow_dispatch:
  push:
    branches: [ci-linux]

concurrency:
  group: ci-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 静态门禁：不需要任何工具链，永远真实执行 ----------
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 静态一致性门禁
        run: python3 scripts/ci/check-consistency.py

      - name: OpenAPI 规范校验
        run: python3 scripts/ci/check-openapi.py

      - name: 部署脚本语法校验
        run: |
          for f in deploy/scripts/*.sh scripts/ci/verify-e2e.sh; do
            bash -n "$f"
          done

  # ---------- Linux 构建（需仓库变量 CANGJIE_LINUX_SDK_URL） ----------
  build-and-test-linux-hosted:
    if: ${{ vars.CANGJIE_LINUX_SDK_URL != '' }}
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Cangjie SDK（Linux）
        run: |
          set -euo pipefail
          URL="${{ vars.CANGJIE_LINUX_SDK_URL }}"
          echo "下载 SDK：${URL}"
          curl -fSL "$URL" -o /tmp/cangjie.tar.gz
          sudo mkdir -p /opt/cangjie
          sudo tar -xzf /tmp/cangjie.tar.gz -C /opt/cangjie --strip-components=1
          /opt/cangjie/bin/cjc -v

      - name: 安装 stdx（Linux）
        if: ${{ vars.CANGJIE_LINUX_STDX_URL != '' }}
        run: |
          set -euo pipefail
          URL="${{ vars.CANGJIE_LINUX_STDX_URL }}"
          curl -fSL "$URL" -o /tmp/stdx.tar.gz
          sudo mkdir -p /opt/cangjie-stdx
          sudo tar -xzf /tmp/stdx.tar.gz -C /opt/cangjie-stdx --strip-components=1

      - name: 构建（Linux）
        run: bash scripts/build-linux.sh

      - name: 单元测试（Linux）
        run: bash scripts/test-linux.sh

      - name: 前端单测与构建
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
